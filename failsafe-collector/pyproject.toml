[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "failsafe-collector"
version = "0.1.0"
description = "A constrained, verifiable agent framework for open-web data collection"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["failsafe*"]
dependencies = [
    "anthropic>=0.40.0",
    "apache-airflow>=2.8.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0",
    "jsonschema>=4.20",
    "playwright>=1.40.0",
    "openpyxl>=3.1.0",
    "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
